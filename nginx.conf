server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /front {
        return 301 /front/;
    }

    # Archivos reales de Angular: JS, CSS, imágenes, fuentes, etc.
    # Si no existen, NO debe devolver index.html porque rompe los chunks.
    location ~* ^/front/.+\.(js|mjs|css|map|json|ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # El index no debe quedarse cacheado, porque cambia los nombres de los chunks.
    location = /front/index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Rutas internas de Angular: /front/procesos/nuevo, /front/login, etc.
    location /front/ {
        try_files $uri $uri/ /front/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}